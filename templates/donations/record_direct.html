{% extends 'base.html' %}

{% block title %}Record Direct Donation - LifeDrop BD{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-custom p-4 p-md-5">
                <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
                    <div class="blood-badge lg">
                        <i class="fa-solid fa-syringe text-danger"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold mb-0 text-dark">Record & Certify Direct Donation</h3>
                        <p class="text-muted small mb-0">Direct record entry for blood donation camps, walk-in donors, or hospital transfusions</p>
                    </div>
                </div>

                <form method="post" action="{% url 'donations:record_direct' %}">
                    {% csrf_token %}

                    <div class="row g-3 mb-4">
                        <div class="col-md-12">
                            <label class="form-label small fw-bold">Select Registered Donor</label>
                            <select name="donor_id" class="form-select" required>
                                <option value="">-- Select Donor --</option>
                                {% for d in donors %}
                                    <option value="{{ d.id }}">
                                        {{ d.user.get_full_name|default:d.user.username }} [{{ d.blood_group.name }}] - {{ d.district.name }} (Last: {{ d.last_donation_date|default:"Never" }})
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Donation Date</label>
                            <input type="date" name="donation_date" class="form-control" required value="{% now 'Y-m-d' %}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Units Collected</label>
                            <input type="number" name="units_donated" class="form-control" required value="1" min="1" max="5">
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold">Collection Location / Hospital</label>
                            <input type="text" name="donation_location" class="form-control" required placeholder="e.g. DMCH Blood Transfusion Department, Dhaka">
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold">Clinical Remarks / Bag Barcode</label>
                            <textarea name="remarks" class="form-control" rows="2" placeholder="Bag serial number, hemoglobin, post-collection notes..."></textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'accounts:dashboard_redirect' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary-red px-4 fw-bold">
                            <i class="fa-solid fa-save me-2"></i>Certify & Save Record
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
